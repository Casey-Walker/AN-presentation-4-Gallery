<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Metro Analytics Chart Gallery</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<header class="page-header">
  <h1>Metro Analytics: Chart Gallery</h1>
  <p class="subtitle">Where Should a UK Graduate Start a U.S. Analytics Career?</p>
</header>

<div id="gallery"></div>

<div id="presenter" hidden>
  <div class="presenter-bar">
    <a href="#" class="back-link">&larr; Back to gallery</a>
    <span id="presenter-progress"></span>
  </div>
  <div class="presenter-caption">
    <h2 id="presenter-title"></h2>
    <p id="presenter-text"></p>
  </div>
  <div class="presenter-frame-wrap">
    <iframe id="presenter-frame" title="Chart"></iframe>
  </div>
  <div class="presenter-nav">
    <button id="presenter-prev" type="button">&larr; Previous</button>
    <button id="presenter-next" type="button">Next &rarr;</button>
  </div>
</div>

<script src="charts.js"></script>
<script src="app.js"></script>
</body>
</html>
